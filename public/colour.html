<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yumori · Colour Analysis</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .camera-wrap { position:relative; border-radius:22px; overflow:hidden; background:#111; aspect-ratio:3/4; max-width:480px; margin:0 auto; }
  .camera-wrap video { width:100%; height:100%; object-fit:cover; display:block; }
  .drape {
    position:absolute; left:0; right:0; bottom:0; height:45%;
    transition:transform .8s ease, opacity .6s ease;
    transform-origin:bottom center;
  }
  .drape.peeling { transform:translateY(110%) rotate(6deg); opacity:0; }
  .drape-label { position:absolute; left:12px; bottom:12px; color:#fff; font-weight:600;
    text-shadow:0 1px 4px rgba(0,0,0,.7); font-size:.9rem; }
  .donkey-corner { position:absolute; right:8px; bottom:8px; z-index:5; pointer-events:none; }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; justify-content:center; }
  .swatch { width:38px; height:38px; border-radius:50%; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.15); cursor:pointer; }
  .swatch.active { outline:3px solid var(--brown); outline-offset:2px; }
  .palette-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(70px,1fr)); gap:10px; }
  .palette-grid .p { height:60px; border-radius:12px; box-shadow:inset 0 0 0 2px rgba(255,255,255,.4); }
  .hide { display:none !important; }
  #manual-area label { display:block; margin-top:10px; font-weight:600; font-size:.9rem; }
</style>
</head>
<body>
<nav class="topbar" id="topbar"></nav>
<div class="container">
  <h1>Colour Analysis 🎨</h1>
  <p style="opacity:.8">Use neutral lighting, no filters. Jumino will drape fabrics and offer a rough palette guess.</p>

  <div id="setup" class="card">
    <p>Jumino needs to see you — or you can upload a photo / answer a few questions instead.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button id="start-cam">📷 Use camera</button>
      <button id="use-photo">🖼 Upload a photo</button>
      <button id="use-manual">📝 Manual questionnaire</button>
    </div>
    <input type="file" id="photo-input" accept="image/*" class="hide" />
    <p id="setup-err" style="color:#b04"></p>
  </div>

  <div id="cam-area" class="hide" style="margin-top:16px">
    <div class="camera-wrap" id="cam-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="drape" id="drape"><span class="drape-label" id="drape-label"></span></div>
      <div class="donkey-corner"><div id="donkey-cam"></div></div>
    </div>
    <div class="bubble" id="bubble" style="margin:14px auto;max-width:480px">let's try a few colours…</div>
    <div class="swatches" id="swatches"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;justify-content:center">
      <button id="next-drape">Next drape →</button>
      <button id="finish-btn">See my palette ✨</button>
    </div>
  </div>

  <div id="photo-area" class="hide" style="margin-top:16px">
    <img id="photo-preview" style="max-width:100%;border-radius:16px;display:block;margin:0 auto" />
    <div class="bubble" id="photo-bubble" style="margin:12px auto">lovely. i'll estimate from this.</div>
    <button id="photo-finish" style="margin-top:12px;display:block;margin-left:auto;margin-right:auto">See my palette ✨</button>
  </div>

  <div id="manual-area" class="hide card"
