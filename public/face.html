<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yumori · Face Analysis</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .apple-popup {
    position: relative; background: #fffdf7;
    border: 2px dashed rgba(138,106,82,.45);
    border-radius: 48% 48% 42% 42% / 52% 52% 48% 48%;
    padding: 42px 34px 30px; max-width: 560px;
    margin: 24px auto; box-shadow: var(--shadow);
  }
  .apple-popup::before {
    content: ""; position: absolute; top: -14px; left: 50%;
    width: 26px; height: 20px; border-left: 3px solid var(--brown);
    border-bottom: 3px solid var(--brown);
    border-radius: 0 0 0 18px; transform: translateX(-30%) rotate(-20deg);
  }
  .apple-popup::after {
    content: ""; position: absolute; top: -22px; left: calc(50% + 6px);
    width: 18px; height: 12px; background: var(--mint-dark);
    border-radius: 50% 0 50% 0; transform: rotate(-25deg);
  }
  .field-row { display: grid; grid-template-columns: 1fr 110px; gap: 10px; align-items: center; margin-bottom: 12px; }
  .hint { font-size: .78rem; opacity: .7; margin: -6px 0 10px; }
  .envelope-stage {
    position: fixed; inset: 0; background: rgba(253,247,236,.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 50; opacity: 0; pointer-events: none; transition: opacity .4s ease;
  }
  .envelope-stage.show { opacity: 1; pointer-events: auto; }
  .env-big {
    width: 260px; height: 180px; background: var(--brown);
    border-radius: 10px; position: relative; box-shadow: var(--shadow);
    animation: dropIn .7s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes dropIn { from { transform: translateY(-140vh); } to { transform: translateY(0); } }
  .env-big::before {
    content: ""; position: absolute; inset: 10px;
    background-image: radial-gradient(var(--mint) 2px, transparent 2px);
    background-size: 18px 18px; border-radius: 5px;
  }
  .env-open-btn { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 3; }
  .result-card-slide {
    background: var(--paper); border: 2px solid rgba(138,106,82,.3);
    border-radius: 18px; padding: 26px; max-width: 640px; margin: 0 auto;
    box-shadow: var(--shadow); animation: slideUp .6s ease;
  }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .tabs button.active { background: var(--mint-dark); }
  .tab-panel { padding: 14px; background: #fffdf7; border-radius: 14px; border: 1px dashed rgba(138,106,82,.3); }
</style>
</head>
<body>
<nav class="topbar" id="topbar"></nav>
<div class="container">
  <h1>Face Analysis 💇</h1>
  <p style="opacity:.8">A few proportions, and Jumino will tuck a face-shape card into an envelope.</p>

  <div id="form-area">
    <div style="text-align:center;margin-bottom:8px">
      <div id="donkey"></div>
      <div class="bubble" id="bubble" style="max-width:280px;margin:0 auto">let's measure gently…</div>
    </div>

    <div class="apple-popup">
      <h2 style="text-align:center">Measurements</h2>
      <div class="field-row"><label for="f-length">Face length</label><input id="f-length" type="number" min="5" max="40" step="0.1" placeholder="cm" /></div>
      <p class="hint">From hairline (top of forehead) to bottom of chin.</p>
      <div class="field-row"><label for="f-forehead">Forehead width</label><input id="f-forehead" type="number" min="2" max="30" step="0.1" placeholder="cm" /></div>
      <p class="hint">Widest part of the forehead.</p>
      <div class="field-row"><label for="f-cheek">Cheekbone width</label><input id="f-cheek" type="number" min="2" max="30" step="0.1" placeholder="cm" /></div>
      <p class="hint">Across the cheekbones, ear to ear.</p>
      <div class="field-row"><label for="f-jaw">Jawline width</label><input id="f-jaw" type="number" min="2" max="30" step="0.1" placeholder="cm" /></div>
      <p class="hint">Across the jaw, widest point near the ears.</p>
      <div class="field-row"><label for="f-unit">Unit</label>
        <select id="f-unit"><option value="cm">cm</option><option value="in">inches</option></select>
      </div>
      <p id="f-err" style="color:#b04;min-height:1em"></p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:8px">
        <button id="calc-btn">Continue →</button>
      </div>
    </div>
  </div>

  <div class="envelope-stage" id="env-stage">
    <div style="text-align:center">
      <div id="env-donkey"></div>
      <div class="env-big"><button class="env-open-btn" id="env-open">Open</button></div>
    </div>
  </div>

  <div id="result-area" style="display:none;margin-top:24px">
    <div class="result-card-slide" id="result-card"></div>
  </div>
</div>

<script type="module">
import { requireUser, navbar } from "/js/shared.js";
import { mountDonkey, speakInto } from "/js/donkey.js";

const me = await requireUser();
document.getElementById("topbar").innerHTML = navbar(me);
const $ = (id) => document.getElementById(id);
mountDonkey($("donkey"), "idle", 130);
speakInto($("bubble"), "let's measure gently. no pressure to be exact.");

function classify({ length, forehead, cheek, jaw }) {
  const ratio = length / cheek;
  const foreheadVsCheek = forehead / cheek;
  const jawVsCheek = jaw / cheek;

  if (ratio < 1.25 && Math.abs(forehead - cheek) < cheek * 0.1 && Math.abs(cheek - jaw) < cheek * 0.1)
    return { shape: "Round", tip: "Soft, curved contours. Longer hairstyles and angular frames add contrast." };
  if (ratio >= 1.45 && foreheadVsCheek > 0.9 && jawVsCheek < 0.85)
    return { shape: "Heart", tip: "Wider forehead, narrower jaw. Soft layered styles and V-necks balance it." };
  if (ratio >= 1.4 && foreheadVsCheek < 0.85 && jawVsCheek < 0.85)
    return { shape: "Oval", tip: "Versatile and balanced. Most styles and frames suit you." };
  if (jawVsCheek >= 0.9 && foreheadVsCheek >= 0.85 && ratio < 1.4)
    return { shape: "Square", tip: "Strong jawline. Soft waves and rounded frames soften edges." };
  if (ratio >= 1.5 && foreheadVsCheek < 0.9 && jawVsCheek < 0.85)
    return { shape: "Oblong", tip: "Longer proportions. Layers and side parts add width." };
  if (jawVsCheek >= 0.85 && foreheadVsCheek < 0.85)
    return { shape: "Diamond", tip: "Prominent cheekbones, narrow forehead and jaw. Side-swept styles and smaller frames work well." };
  return { shape: "Oval", tip: "Balanced proportions. Most styles and frames suit you." };
}

const TAB_CONTENT = {
  Hairstyles: "Soft layers around the face add movement. Consider the lengths you love and work with your natural texture.",
  "Earrings & jewellery": "Small studs or hoops scaled to your face balance proportions. Long drops elongate.",
  Necklines: "V-necks, scoop and soft crew necks flatter most. Higher necklines work with a defined shoulder.",
  "Glasses & accessories": "Frames that echo your face's softer or sharper lines create harmony. Try both!",
  "Hair partings": "Side parts add width; middle parts elongate. Both are lovely — rotate for variety.",
};

function faceSVG(shape) {
  const c = `fill="#bfe3d0" stroke="#8a6a52" stroke-width="1.5"`;
  let body = "";
  switch (shape) {
    case "Round": body = `<circle cx="70" cy="60" r="35" ${c}/>`; break;
    case "Heart": body = `<path d="M40 40 Q70 10 100 40 Q100 80 70 100 Q40 80 40 40 Z" ${c}/>`; break;
    case "Square": body = `<rect x="35" y="25" width="70" height="70" rx="6" ${c}/>`; break;
    case "Oblong": body = `<ellipse cx="70" cy="60" rx="26" ry="42" ${c}/>`; break;
    case "Diamond": body = `<path d="M70 15 L100 60 L70 105 L40 60 Z" ${c}/>`; break;
    default: body = `<ellipse cx="70" cy="60" rx="32" ry="42" ${c}/>`;
  }
  return `<svg width="150" height="130" viewBox="0 0 140 120">${body}</svg>`;
}

function buildResult(data) {
  const tabs = Object.keys(TAB_CONTENT);
  const bar = tabs.map((t,i)=>`<button class="tab-btn${i===0?" active":""}" data-tab="${t}">${t}</button>`).join("");
  const panels = tabs.map((t,i)=>`<div class="tab-panel tab-content" data-tab="${t}" style="${i===0?"":"display:none"}">${TAB_CONTENT[t]}</div>`).join("");
  return `
    <div style="text-align:center">${faceSVG(data.shape)}</div>
    <h2>${data.shape}</h2>
    <p>${data.tip}</p>
    <div class="tabs" style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0">${bar}</div>
    <div>${panels}</div>
    <p style="font-size:.82rem;opacity:.7;margin-top:14px">
      Based on ratios of length ${data.measurements.length.toFixed(1)}cm ·
      forehead ${data.measurements.forehead.toFixed(1)}cm ·
      cheek ${data.measurements.cheek.toFixed(1)}cm ·
      jaw ${data.measurements.jaw.toFixed(1)}cm.
      No shape is better than another — these are optional styling ideas.
    </p>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="edit-btn">↺ Edit measurements</button>
    </div>
  `;
}

$("calc-btn").onclick = () => {
  $("f-err").textContent = "";
  const unit = $("f-unit").value;
  const mult = unit === "in" ? 2.54 : 1;
  const length = parseFloat($("f-length").value) * mult;
  const forehead = parseFloat($("f-forehead").value) * mult;
  const cheek = parseFloat($("f-cheek").value) * mult;
  const jaw = parseFloat($("f-jaw").value) * mult;
  if (!(length>0 && forehead>0 && cheek>0 && jaw>0)) {
    $("f-err").textContent = "Please fill all four fields with positive values.";
    return;
  }
  const result = classify({ length, forehead, cheek, jaw });
  const payload = { shape: result.shape, tip: result.tip, measurements: { length, forehead, cheek, jaw, unit:"cm" } };
  fetch("/api/analyses/face", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify(payload),
  });

  const stage = $("env-stage");
  mountDonkey($("env-donkey"), "present", 100);
  stage.classList.add("show");

  $("env-open").onclick = () => {
    stage.classList.remove("show");
    $("form-area").style.display = "none";
    $("result-area").style.display = "block";
    $("result-card").innerHTML = buildResult(payload);
    document.getElementById("edit-btn").onclick = () => {
      $("result-area").style.display = "none";
      $("form-area").style.display = "block";
    };
    document.querySelectorAll(".tab-btn").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll(".tab-btn").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        document.querySelectorAll(".tab-content").forEach(p => {
          p.style.display = p.dataset.tab === b.dataset.tab ? "block" : "none";
        });
      };
    });
  };
};

const saved = await (await fetch("/api/analyses/face")).json();
if (saved?.data?.shape) speakInto($("bubble"), `we found ${saved.data.shape.toLowerCase()} last time — retake whenever you like.`);
</script>
</body>
</html>
